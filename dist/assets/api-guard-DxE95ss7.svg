<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230">
  <defs>
    <linearGradient id="ag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="terminal-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <linearGradient id="pass-grd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="warn-grd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="fail-grd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="230" fill="url(#ag-bg)" rx="12"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="360" height="36" fill="#ffffff" fill-opacity="0.05" rx="12"/>
  <circle cx="16" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="32" cy="18" r="5" fill="#febc2e"/>
  <circle cx="48" cy="18" r="5" fill="#28c840"/>
  <text x="180" y="23" font-family="'SF Mono', 'Courier New', monospace" font-size="11" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" letter-spacing="2">API-CONTRACTGUARD  CLI</text>

  <!-- Terminal window -->
  <rect x="14" y="44" width="196" height="148" fill="url(#terminal-bg)" rx="8" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Terminal prompt lines -->
  <text x="22" y="62" font-family="'SF Mono', 'Courier New', monospace" font-size="8.5" fill="#6ee7b7">$ api-guard validate --config contracts.json</text>

  <text x="22" y="78" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#ffffff" fill-opacity="0.4">Loading schemas from ./schemas/*.json</text>
  <text x="22" y="90" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#ffffff" fill-opacity="0.4">Found 10 endpoints to validate...</text>
  <text x="22" y="102" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#ffffff" fill-opacity="0.3">───────────────────────────────</text>

  <!-- Results list -->
  <text x="22" y="116" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#10b981">✓ PASS  GET /api/users</text>
  <text x="22" y="128" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#10b981">✓ PASS  POST /api/auth/login</text>
  <text x="22" y="140" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#10b981">✓ PASS  GET /api/products</text>
  <text x="22" y="152" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#f59e0b">⚠ WARN  GET /api/orders  [nullable field]</text>
  <text x="22" y="164" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#10b981">✓ PASS  PUT /api/cart</text>
  <text x="22" y="176" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#10b981">✓ PASS  DELETE /api/sessions</text>

  <text x="22" y="185" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#ffffff" fill-opacity="0.3">───────────────────────────────</text>

  <!-- Right panel — stats -->
  <!-- Coverage badge -->
  <rect x="222" y="44" width="124" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="284" y="62" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">Test Coverage</text>
  <text x="284" y="85" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#10b981" text-anchor="middle">98%</text>

  <!-- Detection badge -->
  <rect x="222" y="104" width="124" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
  <text x="284" y="122" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">Drift Detection</text>
  <text x="284" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#818cf8" text-anchor="middle">99.9%</text>

  <!-- Test count -->
  <rect x="222" y="164" width="124" height="28" rx="6" fill="#ffffff" fill-opacity="0.04"/>
  <text x="284" y="175" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">Jest Suite</text>
  <text x="284" y="186" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#f9a8d4" text-anchor="middle">36 tests · 10 endpoints</text>

  <!-- Badge row: PASS / WARN / FAIL -->
  <rect x="222" y="44" width="0" height="0"/>
  <!-- PASS badge -->
  <rect x="14"  y="192" width="40" height="16" rx="4" fill="url(#pass-grd)"/>
  <text x="34"  y="204" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">PASS</text>
  <!-- WARN badge -->
  <rect x="60"  y="192" width="44" height="16" rx="4" fill="url(#warn-grd)"/>
  <text x="82"  y="204" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">WARN</text>
  <!-- FAIL badge -->
  <rect x="110" y="192" width="36" height="16" rx="4" fill="url(#fail-grd)"/>
  <text x="128" y="204" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">FAIL</text>

  <!-- Footer tags -->
  <rect x="0" y="198" width="360" height="32" fill="#ffffff" fill-opacity="0.05"/>
  <text x="16"  y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#818cf8" opacity="0.9">#Node.js</text>
  <text x="65"  y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#818cf8" opacity="0.9">#JSON Schema</text>
  <text x="151" y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#818cf8" opacity="0.9">#AJV</text>
  <text x="183" y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#818cf8" opacity="0.9">#Jest</text>
  <text x="218" y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#818cf8" opacity="0.9">#CI/CD</text>
  <text x="263" y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#818cf8" opacity="0.9">#OOP</text>
</svg>
