<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d0d1a"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0d1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Knowledge graph nodes -->
  <!-- Central hub -->
  <circle cx="400" cy="240" r="28" fill="#7c3aed" opacity="0.9"/>
  <text x="400" y="245" font-family="monospace" font-size="11" fill="white" text-anchor="middle" font-weight="bold">OKF</text>

  <!-- Surrounding nodes -->
  <circle cx="240" cy="140" r="20" fill="#4f46e5" opacity="0.85"/>
  <text x="240" y="145" font-family="monospace" font-size="9" fill="white" text-anchor="middle">FAISS</text>

  <circle cx="560" cy="140" r="20" fill="#4f46e5" opacity="0.85"/>
  <text x="560" y="145" font-family="monospace" font-size="9" fill="white" text-anchor="middle">RAG</text>

  <circle cx="180" cy="270" r="18" fill="#6d28d9" opacity="0.8"/>
  <text x="180" y="275" font-family="monospace" font-size="8" fill="white" text-anchor="middle">Doc</text>

  <circle cx="620" cy="270" r="18" fill="#6d28d9" opacity="0.8"/>
  <text x="620" y="275" font-family="monospace" font-size="8" fill="white" text-anchor="middle">Claude</text>

  <circle cx="300" cy="350" r="18" fill="#5b21b6" opacity="0.8"/>
  <text x="300" y="355" font-family="monospace" font-size="8" fill="white" text-anchor="middle">YAML</text>

  <circle cx="500" cy="350" r="18" fill="#5b21b6" opacity="0.8"/>
  <text x="500" y="355" font-family="monospace" font-size="8" fill="white" text-anchor="middle">Graph</text>

  <circle cx="400" cy="120" r="16" fill="#7c3aed" opacity="0.75"/>
  <text x="400" y="125" font-family="monospace" font-size="8" fill="white" text-anchor="middle">API</text>

  <!-- Graph edges -->
  <line x1="400" y1="212" x2="240" y2="160" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="212" x2="560" y2="160" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="240" x2="180" y2="270" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="240" x2="620" y2="270" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="268" x2="300" y2="332" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="268" x2="500" y2="332" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="212" x2="400" y2="136" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="240" y1="160" x2="180" y2="252" stroke="#a78bfa" stroke-width="1" opacity="0.25"/>
  <line x1="560" y1="160" x2="620" y2="252" stroke="#a78bfa" stroke-width="1" opacity="0.25"/>
  <line x1="300" y1="332" x2="180" y2="288" stroke="#a78bfa" stroke-width="1" opacity="0.2"/>
  <line x1="500" y1="332" x2="620" y2="288" stroke="#a78bfa" stroke-width="1" opacity="0.2"/>

  <!-- Stats panel bottom -->
  <rect x="60" y="410" width="680" height="60" rx="8" fill="#13132a" stroke="#4f46e5" stroke-width="1"/>
  <text x="160" y="435" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">1,200+ docs</text>
  <text x="160" y="455" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">indexed</text>
  <line x1="240" y1="415" x2="240" y2="465" stroke="#4f46e5" stroke-width="1" opacity="0.4"/>
  <text x="330" y="435" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">Recall@10 +24%</text>
  <text x="330" y="455" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">vs flat RAG</text>
  <line x1="430" y1="415" x2="430" y2="465" stroke="#4f46e5" stroke-width="1" opacity="0.4"/>
  <text x="540" y="435" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">1.8s → 640ms</text>
  <text x="540" y="455" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">query latency</text>
  <line x1="640" y1="415" x2="640" y2="465" stroke="#4f46e5" stroke-width="1" opacity="0.4"/>
  <text x="710" y="435" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">−62%</text>
  <text x="710" y="455" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">tokens/query</text>

  <!-- Title -->
  <text x="400" y="45" font-family="Arial" font-size="22" font-weight="700" fill="#a78bfa" text-anchor="middle">ContextForge</text>
  <text x="400" y="70" font-family="Arial" font-size="13" fill="#7c3aed" text-anchor="middle">Agentic Knowledge Base · OKF · FAISS · Knowledge Graph · Claude API</text>
</svg>
