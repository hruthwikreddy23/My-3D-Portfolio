<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230">
  <defs>
    <linearGradient id="sx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b263b"/>
    </linearGradient>
    <linearGradient id="approved" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="pending" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="open" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="230" fill="url(#sx-bg)" rx="12"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="360" height="36" fill="#ffffff" fill-opacity="0.05" rx="12"/>
  <circle cx="16" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="32" cy="18" r="5" fill="#febc2e"/>
  <circle cx="48" cy="18" r="5" fill="#28c840"/>
  <text x="180" y="23" font-family="'SF Mono', 'Courier New', monospace" font-size="11" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" letter-spacing="2">SCHEDULEX  —  SHIFT  MANAGEMENT</text>

  <!-- ScheduleX logo text -->
  <text x="24" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#10b981">ScheduleX</text>
  <text x="148" y="62" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.4">500+ shifts · 50 workers</text>

  <!-- Week day headers -->
  <text x="80"  y="82" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">MON</text>
  <text x="124" y="82" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">TUE</text>
  <text x="168" y="82" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">WED</text>
  <text x="212" y="82" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">THU</text>
  <text x="256" y="82" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">FRI</text>
  <text x="300" y="82" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">SAT</text>
  <text x="340" y="82" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">SUN</text>

  <!-- Row labels -->
  <text x="30" y="102" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">8–12</text>
  <text x="30" y="124" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">12–4</text>
  <text x="30" y="146" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">4–8</text>
  <text x="30" y="168" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">8–12</text>

  <!-- Grid lines -->
  <line x1="55" y1="87"  x2="355" y2="87"  stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="55" y1="109" x2="355" y2="109" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="55" y1="131" x2="355" y2="131" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="55" y1="153" x2="355" y2="153" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="55" y1="175" x2="355" y2="175" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <line x1="58"  y1="87" x2="58"  y2="175" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="102" y1="87" x2="102" y2="175" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="146" y1="87" x2="146" y2="175" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="190" y1="87" x2="190" y2="175" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="234" y1="87" x2="234" y2="175" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="278" y1="87" x2="278" y2="175" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="320" y1="87" x2="320" y2="175" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Shift blocks — approved (green) -->
  <rect x="60"  y="90" width="40" height="18" rx="3" fill="url(#approved)" opacity="0.9"/>
  <text x="80"  y="102" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Alex M.</text>
  <rect x="148" y="90" width="40" height="18" rx="3" fill="url(#approved)" opacity="0.9"/>
  <text x="168" y="102" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Jordan L.</text>
  <rect x="236" y="90" width="40" height="18" rx="3" fill="url(#approved)" opacity="0.9"/>
  <text x="256" y="102" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Sam K.</text>
  <rect x="60"  y="112" width="40" height="18" rx="3" fill="url(#approved)" opacity="0.9"/>
  <text x="80"  y="124" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Chris P.</text>
  <rect x="192" y="112" width="40" height="18" rx="3" fill="url(#approved)" opacity="0.9"/>
  <text x="212" y="124" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Maya R.</text>
  <rect x="280" y="112" width="40" height="18" rx="3" fill="url(#approved)" opacity="0.9"/>
  <text x="300" y="124" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Riley S.</text>
  <rect x="104" y="134" width="40" height="18" rx="3" fill="url(#approved)" opacity="0.9"/>
  <text x="124" y="146" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Jordan L.</text>
  <rect x="280" y="134" width="40" height="18" rx="3" fill="url(#approved)" opacity="0.9"/>
  <text x="300" y="146" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Alex M.</text>

  <!-- Shift blocks — pending (yellow) -->
  <rect x="104"  y="90"  width="40" height="18" rx="3" fill="url(#pending)" opacity="0.9"/>
  <text x="124"  y="102" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Taylor W.</text>
  <rect x="192"  y="90"  width="40" height="18" rx="3" fill="url(#pending)" opacity="0.9"/>
  <text x="212"  y="102" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Dana B.</text>
  <rect x="148"  y="134" width="40" height="18" rx="3" fill="url(#pending)" opacity="0.9"/>
  <text x="168"  y="146" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Chris P.</text>
  <rect x="60"   y="156" width="40" height="18" rx="3" fill="url(#pending)" opacity="0.9"/>
  <text x="80"   y="168" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Dana B.</text>
  <rect x="236"  y="156" width="40" height="18" rx="3" fill="url(#pending)" opacity="0.9"/>
  <text x="256"  y="168" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">Taylor W.</text>

  <!-- Shift blocks — open (blue) -->
  <rect x="280" y="90"  width="40" height="18" rx="3" fill="url(#open)" opacity="0.9"/>
  <text x="300" y="102" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">OPEN</text>
  <rect x="60"  y="134" width="40" height="18" rx="3" fill="url(#open)" opacity="0.7"/>
  <text x="80"  y="146" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">OPEN</text>
  <rect x="192" y="156" width="40" height="18" rx="3" fill="url(#open)" opacity="0.7"/>
  <text x="212" y="168" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">OPEN</text>

  <!-- Legend -->
  <rect x="60"  y="182" width="8" height="8" rx="2" fill="#10b981"/>
  <text x="72"  y="190" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.6">Approved</text>
  <rect x="130" y="182" width="8" height="8" rx="2" fill="#f59e0b"/>
  <text x="142" y="190" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.6">Pending</text>
  <rect x="196" y="182" width="8" height="8" rx="2" fill="#3b82f6"/>
  <text x="208" y="190" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.6">Open</text>

  <!-- Footer tags -->
  <rect x="0" y="198" width="360" height="32" fill="#ffffff" fill-opacity="0.05"/>
  <text x="16"  y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#10b981" opacity="0.9">#React</text>
  <text x="58"  y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#10b981" opacity="0.9">#TypeScript</text>
  <text x="136" y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#10b981" opacity="0.9">#Supabase</text>
  <text x="206" y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#10b981" opacity="0.9">#FIFO Queue</text>
  <text x="282" y="218" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#10b981" opacity="0.9">#GPS</text>
</svg>
