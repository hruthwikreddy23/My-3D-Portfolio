<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#0d1117" rx="24"/>
  <!-- Azure prism: three triangular faces -->
  <!-- Left face (dark blue) -->
  <polygon points="54,182 128,40 128,182" fill="#0072C6"/>
  <!-- Right face (medium blue) -->
  <polygon points="128,40 202,182 128,182" fill="#1E88E5"/>
  <!-- Bottom reflection shape -->
  <polygon points="54,182 120,162 202,182 162,202" fill="#0053A6"/>
  <text x="128" y="230" font-family="Arial" font-size="22" font-weight="700" fill="#1E88E5" text-anchor="middle">Azure</text>
</svg>
