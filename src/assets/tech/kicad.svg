<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#0d1117" rx="24"/>
  <!-- PCB trace background pattern -->
  <line x1="40" y1="80" x2="90" y2="80" stroke="#1E5FA8" stroke-width="4" opacity="0.4"/>
  <line x1="90" y1="80" x2="90" y2="120" stroke="#1E5FA8" stroke-width="4" opacity="0.4"/>
  <line x1="166" y1="120" x2="216" y2="120" stroke="#1E5FA8" stroke-width="4" opacity="0.4"/>
  <line x1="166" y1="80" x2="166" y2="120" stroke="#1E5FA8" stroke-width="4" opacity="0.4"/>
  <line x1="40" y1="160" x2="216" y2="160" stroke="#1E5FA8" stroke-width="4" opacity="0.4"/>
  <!-- Solder pads -->
  <circle cx="90" cy="80" r="7" fill="#1E5FA8" opacity="0.6"/>
  <circle cx="166" cy="80" r="7" fill="#1E5FA8" opacity="0.6"/>
  <circle cx="90" cy="120" r="7" fill="#1E5FA8" opacity="0.6"/>
  <circle cx="166" cy="120" r="7" fill="#1E5FA8" opacity="0.6"/>
  <circle cx="40" cy="160" r="7" fill="#1E5FA8" opacity="0.6"/>
  <circle cx="216" cy="160" r="7" fill="#1E5FA8" opacity="0.6"/>
  <!-- KiCAD bold text -->
  <text x="128" y="115" font-family="Arial Black" font-size="46" font-weight="900" fill="#1E5FA8" text-anchor="middle">Ki</text>
  <text x="128" y="155" font-family="Arial Black" font-size="46" font-weight="900" fill="#4A9BE8" text-anchor="middle">CAD</text>
  <text x="128" y="220" font-family="Arial" font-size="18" font-weight="700" fill="#1E5FA8" text-anchor="middle">KiCAD EDA</text>
</svg>
