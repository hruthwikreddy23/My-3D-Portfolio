<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#0d1117" rx="24"/>
  <!-- Bidirectional arrows representing full-duplex -->
  <!-- Left bracket / socket -->
  <path d="M60,100 L36,128 L60,156" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right bracket / socket -->
  <path d="M196,100 L220,128 L196,156" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow right (top) -->
  <line x1="76" y1="112" x2="180" y2="112" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
  <polyline points="168,102 180,112 168,122" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow left (bottom) -->
  <line x1="76" y1="144" x2="180" y2="144" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
  <polyline points="88,134 76,144 88,154" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Label -->
  <text x="128" y="210" font-family="Arial" font-size="19" font-weight="700"
        fill="#3B82F6" text-anchor="middle">WebSocket</text>
</svg>
