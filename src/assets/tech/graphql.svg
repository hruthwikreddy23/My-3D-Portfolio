<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Dark background -->
  <rect width="256" height="256" fill="#0d0d0d" rx="32"/>

  <!-- GraphQL hexagon ring — 6 outer nodes + connecting lines -->
  <!-- Node positions (r=72 from centre 128,118): -->
  <!-- top:        128, 46  -->
  <!-- top-right:  190, 82  -->
  <!-- bot-right:  190, 154 -->
  <!-- bottom:     128, 190 -->
  <!-- bot-left:    66, 154 -->
  <!-- top-left:    66, 82  -->
  <!-- centre:     128, 118 -->

  <!-- Connecting lines (hex outline + diagonals) -->
  <g stroke="#E10098" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <!-- Hex outline -->
    <line x1="128" y1="46"  x2="190" y2="82"/>
    <line x1="190" y1="82"  x2="190" y2="154"/>
    <line x1="190" y1="154" x2="128" y2="190"/>
    <line x1="128" y1="190" x2="66"  y2="154"/>
    <line x1="66"  y1="154" x2="66"  y2="82"/>
    <line x1="66"  y1="82"  x2="128" y2="46"/>
    <!-- Diagonals through centre -->
    <line x1="128" y1="46"  x2="66"  y2="154"/>
    <line x1="128" y1="46"  x2="190" y2="154"/>
    <line x1="66"  y1="82"  x2="190" y2="82"/>
    <line x1="66"  y1="154" x2="190" y2="154"/>
    <line x1="66"  y1="82"  x2="128" y2="190"/>
    <line x1="190" y1="82"  x2="128" y2="190"/>
  </g>

  <!-- Outer nodes -->
  <circle cx="128" cy="46"  r="9" fill="#E10098"/>
  <circle cx="190" cy="82"  r="9" fill="#E10098"/>
  <circle cx="190" cy="154" r="9" fill="#E10098"/>
  <circle cx="128" cy="190" r="9" fill="#E10098"/>
  <circle cx="66"  cy="154" r="9" fill="#E10098"/>
  <circle cx="66"  cy="82"  r="9" fill="#E10098"/>

  <!-- "GraphQL" label -->
  <text x="128" y="230"
        font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="24"
        font-weight="900"
        fill="#E10098"
        text-anchor="middle"
        letter-spacing="1">GraphQL</text>
</svg>
